{{- if .Values.attestor.enabled }}
{{- if and (not .Values.attestor.tls.enabled) (not (hasPrefix "unix://" .Values.attestor.listenAddress)) }}
{{- fail "attestor.tls.enabled is required for a TCP attestor listener" }}
{{- end }}
{{- if and .Values.attestor.service.enabled (hasPrefix "unix://" .Values.attestor.listenAddress) }}
{{- fail "attestor.service.enabled requires a TCP attestor listenAddress" }}
{{- end }}
{{- if and .Values.attestor.probes.enabled (hasPrefix "unix://" .Values.attestor.listenAddress) }}
{{- fail "attestor.probes.enabled requires a TCP attestor listenAddress" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kci.componentName" (dict "root" . "component" "attestor") }}
  labels:
    {{- include "kci.componentLabels" (dict "root" . "component" "attestor") | nindent 4 }}
spec:
  replicas: {{ .Values.attestor.replicaCount }}
  selector:
    matchLabels:
      {{- include "kci.selectorLabels" (dict "root" . "component" "attestor") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kci.componentLabels" (dict "root" . "component" "attestor") | nindent 8 }}
      annotations:
        checksum/config: {{ include "kci.attestorConfig" . | sha256sum }}
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.attestor.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kci.attestorServiceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.attestor.terminationGracePeriodSeconds }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      {{- with .Values.attestor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.attestor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.attestor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.attestor.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sa-attestor
          image: {{ include "kci.image" (dict "root" . "component" "attestor" "image" .Values.attestor.image) }}
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.attestor.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
          args:
            - {{ printf "--listen-address=%s" .Values.attestor.listenAddress | quote }}
            - {{ printf "--attestor-identity=%s" .Values.attestor.config.attestor_identity | quote }}
            - {{ printf "--attestor-key-file=%s/%s" (trimSuffix "/" .Values.attestor.attestorKey.mountPath) .Values.attestor.attestorKey.key | quote }}
            - {{ printf "--cluster-id=%s" .Values.attestor.config.cluster_id | quote }}
            - {{ printf "--issuer=%s" .Values.attestor.config.issuer | quote }}
            - {{ printf "--token-generation=%s" .Values.attestor.config.token_generation | quote }}
            - {{ printf "--token-key-id=%s" .Values.attestor.config.token_key_id | quote }}
            - {{ printf "--default-audience=%s" .Values.attestor.config.default_audience | quote }}
            - {{ printf "--max-token-lifetime=%s" .Values.attestor.config.max_token_lifetime | quote }}
            - {{ printf "--kube-api-token-file=%s" .Values.attestor.kubeAPI.tokenFile | quote }}
            - {{ printf "--kube-api-ca-file=%s" .Values.attestor.kubeAPI.caFile | quote }}
            {{- if .Values.attestor.kubeAPI.server }}
            - {{ printf "--kube-api-server=%s" .Values.attestor.kubeAPI.server | quote }}
            {{- end }}
            {{- if .Values.attestor.tls.enabled }}
            - {{ printf "--tls-cert-file=%s" .Values.attestor.tls.certFile | quote }}
            - {{ printf "--tls-key-file=%s" .Values.attestor.tls.keyFile | quote }}
            - {{ printf "--client-ca-file=%s" .Values.attestor.tls.clientCAFile | quote }}
            {{- end }}
          {{- with .Values.attestor.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.attestor.service.enabled .Values.attestor.probes.enabled }}
          ports:
            - name: http
              containerPort: {{ .Values.attestor.service.targetPort }}
              protocol: TCP
          {{- end }}
          {{- if .Values.attestor.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.attestor.probes.liveness.path }}
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" .Values.attestor.tls.enabled }}
            initialDelaySeconds: {{ .Values.attestor.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.attestor.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.attestor.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.attestor.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.attestor.probes.readiness.path }}
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" .Values.attestor.tls.enabled }}
            initialDelaySeconds: {{ .Values.attestor.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.attestor.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.attestor.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.attestor.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.attestor.resources | nindent 12 }}
          volumeMounts:
            - name: attestor-key
              mountPath: {{ .Values.attestor.attestorKey.mountPath }}
              readOnly: true
            {{- if .Values.attestor.tls.enabled }}
            - name: tls
              mountPath: /etc/k8s-credential-issuance/tls
              readOnly: true
            {{- end }}
            {{- with .Values.attestor.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: attestor-key
          secret:
            secretName: {{ include "kci.attestorKeySecretName" . }}
            defaultMode: 288
            items:
              - key: {{ .Values.attestor.attestorKey.key | quote }}
                path: {{ .Values.attestor.attestorKey.key | quote }}
        {{- if .Values.attestor.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "kci.attestorTLSSecretName" . }}
            defaultMode: 288
            items:
              - key: {{ .Values.attestor.tls.certKey | quote }}
                path: {{ .Values.attestor.tls.certKey | quote }}
              - key: {{ .Values.attestor.tls.keyKey | quote }}
                path: {{ .Values.attestor.tls.keyKey | quote }}
              - key: {{ .Values.attestor.tls.clientCAKey | quote }}
                path: {{ .Values.attestor.tls.clientCAKey | quote }}
        {{- end }}
        {{- with .Values.attestor.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
