{{- if .Values.nodeAgent.enabled }}
{{- if and .Values.nodeAgent.service.enabled (hasPrefix "unix://" .Values.nodeAgent.listenAddress) }}
{{- fail "nodeAgent.service.enabled requires a TCP nodeAgent.listenAddress" }}
{{- end }}
{{- if and .Values.nodeAgent.probes.enabled (hasPrefix "unix://" .Values.nodeAgent.listenAddress) }}
{{- fail "nodeAgent.probes.enabled requires a TCP nodeAgent.listenAddress" }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kci.componentName" (dict "root" . "component" "node-agent") }}
  labels:
    {{- include "kci.componentLabels" (dict "root" . "component" "node-agent") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kci.selectorLabels" (dict "root" . "component" "node-agent") | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "kci.componentLabels" (dict "root" . "component" "node-agent") | nindent 8 }}
      annotations:
        checksum/config: {{ include "kci.nodeAgentConfig" . | sha256sum }}
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.nodeAgent.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kci.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.nodeAgent.terminationGracePeriodSeconds }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeAgent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeAgent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeAgent.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.nodeAgent.socket.hostPath .Values.nodeAgent.socket.initContainer.enabled }}
      initContainers:
        - name: prepare-socket-directory
          image: {{ .Values.nodeAgent.socket.initContainer.image }}
          imagePullPolicy: {{ .Values.nodeAgent.socket.initContainer.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - mkdir -p /socket && chown 65532:65532 /socket && chmod 0750 /socket
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
          volumeMounts:
            - name: socket
              mountPath: /socket
      {{- end }}
      containers:
        - name: sa-node-agent
          image: {{ include "kci.image" (dict "root" . "component" "nodeAgent" "image" .Values.nodeAgent.image) }}
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.nodeAgent.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
          args:
            - {{ printf "--config=/etc/k8s-credential-issuance/config/config.json" | quote }}
            - {{ printf "--listen-address=%s" .Values.nodeAgent.listenAddress | quote }}
            {{- if .Values.nodeAgent.tls.enabled }}
            - {{ printf "--tls-cert-file=%s" .Values.nodeAgent.tls.certFile | quote }}
            - {{ printf "--tls-key-file=%s" .Values.nodeAgent.tls.keyFile | quote }}
            {{- end }}
            {{- if .Values.nodeAgent.allowStaticBindings }}
            - --allow-static-bindings
            {{- end }}
          {{- with .Values.nodeAgent.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.nodeAgent.service.enabled .Values.nodeAgent.probes.enabled }}
          ports:
            - name: http
              containerPort: {{ .Values.nodeAgent.service.targetPort }}
              protocol: TCP
          {{- end }}
          {{- if .Values.nodeAgent.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.nodeAgent.probes.liveness.path }}
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" .Values.nodeAgent.tls.enabled }}
            initialDelaySeconds: {{ .Values.nodeAgent.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.nodeAgent.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.nodeAgent.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.nodeAgent.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.nodeAgent.probes.readiness.path }}
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" .Values.nodeAgent.tls.enabled }}
            initialDelaySeconds: {{ .Values.nodeAgent.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.nodeAgent.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.nodeAgent.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.nodeAgent.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.nodeAgent.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/k8s-credential-issuance/config
              readOnly: true
            - name: identity-key
              mountPath: {{ .Values.nodeAgent.identityKey.mountPath }}
              readOnly: true
            - name: socket
              mountPath: {{ .Values.nodeAgent.socket.mountPath }}
            {{- if .Values.nodeAgent.tls.enabled }}
            - name: tls
              mountPath: /etc/k8s-credential-issuance/tls
              readOnly: true
            {{- end }}
            {{- with .Values.nodeAgent.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kci.componentName" (dict "root" . "component" "node-agent") }}-config
            defaultMode: 292
        - name: identity-key
          secret:
            secretName: {{ include "kci.nodeIdentitySecretName" . }}
            defaultMode: 288
            items:
              - key: {{ .Values.nodeAgent.identityKey.key | quote }}
                path: {{ .Values.nodeAgent.identityKey.key | quote }}
        - name: socket
          {{- if .Values.nodeAgent.socket.hostPath }}
          hostPath:
            path: {{ .Values.nodeAgent.socket.hostPath }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.nodeAgent.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "kci.nodeTLSSecretName" . }}
            defaultMode: 288
        {{- end }}
        {{- with .Values.nodeAgent.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
