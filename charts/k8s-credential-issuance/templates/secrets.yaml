{{- if and .Values.authority.enabled .Values.authority.signingKey.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kci.authoritySigningKeySecretName" . }}
  labels:
    {{- include "kci.componentLabels" (dict "root" . "component" "authority") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.authority.signingKey.key | quote }}: |
    {{- required "authority.signingKey.value is required when authority.signingKey.create is true" .Values.authority.signingKey.value | nindent 4 }}
{{- end }}
{{- if and .Values.signer.enabled .Values.signer.kms.authToken.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kci.signerKMSSecretName" . }}
  labels:
    {{- include "kci.componentLabels" (dict "root" . "component" "signer") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.signer.kms.authToken.key | quote }}: |
    {{- required "signer.kms.authToken.value is required when signer.kms.authToken.create is true" .Values.signer.kms.authToken.value | nindent 4 }}
{{- end }}
{{- if and .Values.nodeAgent.enabled .Values.nodeAgent.identityKey.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kci.nodeIdentitySecretName" . }}
  labels:
    {{- include "kci.componentLabels" (dict "root" . "component" "node-agent") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.nodeAgent.identityKey.key | quote }}: |
    {{- required "nodeAgent.identityKey.value is required when nodeAgent.identityKey.create is true" .Values.nodeAgent.identityKey.value | nindent 4 }}
{{- end }}
{{- if and .Values.authority.enabled .Values.authority.tls.enabled .Values.authority.tls.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kci.authorityTLSSecretName" . }}
  labels:
    {{- include "kci.componentLabels" (dict "root" . "component" "authority") | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: |
    {{- required "authority.tls.cert is required when authority.tls.create is true" .Values.authority.tls.cert | nindent 4 }}
  tls.key: |
    {{- required "authority.tls.key is required when authority.tls.create is true" .Values.authority.tls.key | nindent 4 }}
{{- end }}
{{- if and .Values.signer.enabled .Values.signer.tls.enabled .Values.signer.tls.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kci.signerTLSSecretName" . }}
  labels:
    {{- include "kci.componentLabels" (dict "root" . "component" "signer") | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: |
    {{- required "signer.tls.cert is required when signer.tls.create is true" .Values.signer.tls.cert | nindent 4 }}
  tls.key: |
    {{- required "signer.tls.key is required when signer.tls.create is true" .Values.signer.tls.key | nindent 4 }}
{{- end }}
{{- if and .Values.nodeAgent.enabled .Values.nodeAgent.tls.enabled .Values.nodeAgent.tls.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kci.nodeTLSSecretName" . }}
  labels:
    {{- include "kci.componentLabels" (dict "root" . "component" "node-agent") | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: |
    {{- required "nodeAgent.tls.cert is required when nodeAgent.tls.create is true" .Values.nodeAgent.tls.cert | nindent 4 }}
  tls.key: |
    {{- required "nodeAgent.tls.key is required when nodeAgent.tls.create is true" .Values.nodeAgent.tls.key | nindent 4 }}
{{- end }}
