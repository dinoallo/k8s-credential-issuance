{{- if and .Values.attestor.enabled .Values.attestor.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kci.componentName" (dict "root" . "component" "attestor") }}
  labels:
    {{- include "kci.componentLabels" (dict "root" . "component" "attestor") | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - serviceaccounts
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kci.componentName" (dict "root" . "component" "attestor") }}
  labels:
    {{- include "kci.componentLabels" (dict "root" . "component" "attestor") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kci.componentName" (dict "root" . "component" "attestor") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kci.attestorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
