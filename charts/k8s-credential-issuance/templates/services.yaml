{{- if and .Values.authority.enabled .Values.authority.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kci.componentName" (dict "root" . "component" "authority") }}
  labels:
    {{- include "kci.componentLabels" (dict "root" . "component" "authority") | nindent 4 }}
  {{- with .Values.authority.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.authority.service.type }}
  ports:
    - name: http
      port: {{ .Values.authority.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kci.selectorLabels" (dict "root" . "component" "authority") | nindent 4 }}
{{- end }}
{{- if and .Values.signer.enabled .Values.signer.service.enabled }}
---
{{- end }}
{{- if and .Values.signer.enabled .Values.signer.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kci.componentName" (dict "root" . "component" "signer") }}
