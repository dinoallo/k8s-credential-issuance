    {{- include "kci.componentLabels" (dict "root" . "component" "signer") | nindent 4 }}
  {{- with .Values.signer.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.signer.service.type }}
  ports:
    - name: http
      port: {{ .Values.signer.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kci.selectorLabels" (dict "root" . "component" "signer") | nindent 4 }}
{{- end }}
{{- if or (and .Values.signer.enabled .Values.signer.service.enabled) (and .Values.attestor.enabled .Values.attestor.service.enabled) }}
---
{{- end }}
